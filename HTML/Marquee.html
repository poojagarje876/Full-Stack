<!DOCTYPE html>

<head>

    <title>marquee</title>
</head>

<body>
    <!------------------marquee demo------------------------->
    <marquee scrollamount="15px" direction="right" onmouseover="this.stop()" onmouseout="this.start()">
        <a href="https://www.google.com" target=blank> google</a>
    </marquee>
</body>

</html>
