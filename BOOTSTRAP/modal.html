<!DOCTYPE html>
<html>

<head>
    <title>Modal</title>

    <!------------------------External css------------------------------------------>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <!---------------------------Extenal js------------------------------------------>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

</head>
<body> 
    <div class="container">
        <button class="btn btn-danger mt-3"data-bs-toggle=modal data-bs-target="#modal"> Click</button>
        <div class="modal fade" id="modal">
            <div class="modal-dialog modal-lg modal-dialog-centered ">
                <div class="modal-content">
                    <div class="modal-header"><h1 class="m-auto">Introduction</h1>
                    <button class="btn-close btn-danger" data-bs-dismiss="modal"></button></div>
                    
                    <div class="modal-body">Lorem ipsum dolor sit amet consectetur adipisicing elit. Molestiae praesentium exercitationem tenetur sint quibusdam eligendi perferendis adipisci error modi quo?</div>
                    <div class="modal-footer">
                        <button class="btn btn-danger" data-bs-dismiss="modal">close</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
