<!DOCTYPE html>

<head>
    <title>Grid System</title>
    <!-------------------------------------External files css--------------------------------------------->
    <link href="./bootstrap/css/bootstrap.css" type="text/css" rel="stylesheet">
    <link href="./bootstrap/css/bootstrap.min.css" type="text/css" rel="stylesheet">
    <!-------------------------------------External files js--------------------------------------------->
    <link href="./bootstrap/js/bootstrap.js" type="text/js" rel="stylesheet">
    <link href="./bootstrap/js/bootstrap.min.js" type="text/js" rel="stylesheet">
</head>

<body>
    <!------------------------------------------Grid System-----------------------------------------------------------
    1. xtra small(xs)=<575px mobile
    2.small(sm)=≥576px mobile/tab
    3. medium(md)=≥768px minilaptop/tab
    4.large(lg)=≥992px laptop/desktop
    5.xtra large(xl)=≥1200px large desktop
    6.xxtra large(xxl)=≥1400px larger desktop
    ------------------------------------------------------------------------------------------------>
    <!----------------------------------------First Row----------------------------------------------------------------->
    <div class="container-fluid">
        <div class="row">
            <div class=" col-md-12 bg-primary" style="height:100px"></div>
        </div>
        </div>
        <!----------------------------------------second Row----------------------------------------------------------------->
        <div class="container-fluid">
            <div class="row">
                <div class=" col-md-6 bg-danger" style="height:100px"></div>
                <div class=" col-md-6 bg-success" style="height:100px"></div>
            </div>
            </div>
            <!----------------------------------------third Row----------------------------------------------------------------->
            <div class="container-fluid">
                <div class="row">
                    <div class=" col-md-4 bg-dark" style="height:100px"></div>
                    <div class=" col-md-4 bg-info" style="height:100px"></div>
                    <div class=" col-md-4 bg-dark" style="height:100px"></div>
                </div>
                </div>
                <!----------------------------------------fourth Row----------------------------------------------------------------->
           <div class="container-fluid">
                <div class="row">
                    <div class=" col-md-3 bg-danger" style="height:100px"></div>
                    <div class=" col-md-3 bg-success" style="height:100px"></div>
                    <div class=" col-md-3 bg-danger" style="height:100px"></div>
                     <div class=" col-md-3 bg-success" style="height:100px"></div>
                </div>
                </div>
                <!----------------------------------------fifth Row----------------------------------------------------------------->
           <div class="container-fluid">
                <div class="row">
                 <div class="col-md-8 bg-dark" style="height: 100px;">
                    <div class="row">
                    <div class="col-md-4 bg-dark" style="height: 100px;"></div>  
                    <div class="col-md-4 bg-info" style="height: 100px;"></div>  
                     <div class="col-md-4 bg-dark" style="height: 100px;"></div> 
                     </div>
                 </div>   
                  <div class="col-md-2 bg-info" style="height: 100px;"></div>  
                   <div class="col-md-2 bg-dark" style="height: 100px;"></div>  
                </div>
                </div>
                 <!----------------------------------------sixth Row----------------------------------------------------------------->
           <div class="container-fluid">
                <div class="row">
                    <div class=" col-md-2 bg-danger" style="height:100px"></div>
                    <div class=" col-md-2 bg-success" style="height:100px"></div>
                    <div class=" col-md-2 bg-danger" style="height:100px"></div>
                     <div class=" col-md-2 bg-success" style="height:100px"></div>
                       <div class=" col-md-2 bg-danger" style="height:100px"></div>
                     <div class=" col-md-2 bg-success" style="height:100px"></div>
                </div>
                </div>
                <!----------------------------------------seventh Row----------------------------------------------------------------->
                <div class="container-fluid">
                    <div class="row">
                    <div class="col-md-6 bg-warning" style="height: 400px;">
                        <div class="row">
                            <div class="col-md-6 bg-dark" style="height: 200px;">
                                <div class="col-md-11 bg-white" style="height: 160px; margin: 20px;"></div>
                            </div>
                            <div class="col-md-6 bg-info" style="height: 200px;"> 
                                <div class="col-md-11 bg-white" style="height: 160px; margin: 20px;">
                                </div>
                            </div>
                             <div class="col-md-6 bg-info" style="height: 200px;">
                                 <div class="col-md-11 bg-white" style="height: 160px; margin: 20px;"></div>
                             </div>
                            <div class="col-md-6 bg-dark" style="height: 200px;">
                                 <div class="col-md-11 bg-white" style="height: 160px; margin: 20px;"></div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 bg-primary" style="height: 400px;"></div>
                </div>
                </div>
</body>

</html>
