<!DOCTYPE html>

<head>
    <title> Grid Assignment 1</title>
    <!-------------------------------------External files css--------------------------------------------->
    <link href="./bootstrap/css/bootstrap.css" type="text/css" rel="stylesheet">
    <link href="./bootstrap/css/bootstrap.min.css" type="text/css" rel="stylesheet">
    <!-------------------------------------External files js--------------------------------------------->
    <link href="./bootstrap/js/bootstrap.js" type="text/js" rel="stylesheet">
    <link href="./bootstrap/js/bootstrap.min.js" type="text/js" rel="stylesheet">
</head>
<body>
    <!-----------------------------------------Grid Assignment 1 --------------------------------------------------------------------->

    <!----------------------------------------first row-------------------------------------------------------------------------->

    <div class="container-fluid">
<div class="row">
    <div class="col-md-6 bg-primary" style="height: 100px;" ></div>
    <div class="col-md-6 bg-danger" style="height: 100px;" ></div>
</div>
    </div>
     <!----------------------------------------second row-------------------------------------------------------------------------->

    <div class="container-fluid">
<div class="row">
    <div class="col-md-4 bg-warning" style="height: 100px;" ></div>
    <div class="col-md-4 bg-success" style="height: 100px;" ></div>
     <div class="col-md-4 bg-primary" style="height: 100px;" ></div>
</div>
    </div>
     <!----------------------------------------third row-------------------------------------------------------------------------->

    <div class="container-fluid">
<div class="row">
    <div class="col-md-5 bg-secondary" style="height: 100px;" ></div>
    <div class="col-md-2 bg-dark" style="height: 100px;" ></div>
     <div class="col-md-5 bg-info" style="height: 100px;" ></div>
</div>
    </div>
    <!----------------------------------------fourth row-------------------------------------------------------------------------->

    <div class="container-fluid">
<div class="row">
    <div class="col-md-5 bg-info" style="height: 100px;" ></div>
    <div class="col-md-2 bg-primary" style="height: 100px;" ></div>
     <div class="col-md-5 bg-secondary" style="height: 100px;" ></div>
</div>
    </div>
    <!----------------------------------------fifth row-------------------------------------------------------------------------->

    <div class="container-fluid">
<div class="row">
    <div class="col-md-8 bg-danger" style="height: 200px;" >
        <div class="row">
            <div class="col-md-7 bg-danger" style="height: 200px;">
                 <div class="row">
                <div class="col-md-12 bg-danger" style="height: 100px;"></div>
            <div class="col-md-12 bg-warning" style="height: 100px;"></div>
        </div>
            </div>
              <div class="col-md-5 bg-success" style="height: 200px;"></div>
        </div>
    </div>
     <div class="col-md-4 bg-warning" style="height: 200px;" >
        
              <div class="row">
                <div class="col-md-12 bg-warning" style="height: 100px;"></div>
            <div class="col-md-12 bg-danger" style="height: 100px;"></div>
        </div>
     </div>
</div>
    </div>
    <!----------------------------------------sixth row-------------------------------------------------------------------------->

    <div class="container-fluid">
<div class="row">
    <div class="col-md-6 bg-dark" style="height: 200px;" >
        <div class="row">
            <div class="col-md-11 bg-white" style="height: 160px; margin: 20px;"></div>
        </div>
    </div>
    <div class="col-md-6 bg-info" style="height: 200px;" >
        <div class="row">
            <div class="col-md-6 bg-info" style="height: 200px;">
                <div class="col-md-11 bg-danger" style="height: 100px; margin: 50px;"></div>
            </div>
              <div class="col-md-6 bg-info" style="height: 200px;">
                 <div class="col-md-11 bg-danger" style="height: 100px; margin: 50px;"></div>
              </div>
        </div>
    </div>
</div>
    </div>
</body>
</html>
